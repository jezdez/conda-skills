[workspace]
name = "conda-skills"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
conda = ">=26.9"
rich = ">=13"
pip = "*"
setuptools = ">=77.0.3"
pytest = ">=8"
ruff = ">=0.14"
ty = ">=0.0.1"
prek = ">=0.5.9"
python-build = ">=1"

[tasks]
install = "python -m pip install --no-deps --no-build-isolation -e ."
test = {cmd = "pytest", depends-on = ["install"]}
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
type-check = "ty check src"
check = {depends-on = ["test", "lint", "format-check", "type-check"]}
build = "python -m build --no-isolation"
prek = "prek run --all-files"
