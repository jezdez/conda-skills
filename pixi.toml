[workspace]
name = "conda-skills"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
conda = ">=26.9"
"ruamel.yaml" = ">=0.11.14,<0.20"
rich = ">=13"
pip = "*"
setuptools = ">=77.0.3"
pytest = ">=8"
ruff = ">=0.14"
ty = ">=0.0.1"
prek = ">=0.5.9"
python-build = ">=1"

[tasks]
install = "python -m pip install --no-deps --no-build-isolation -e ."
test = {cmd = "pytest", depends-on = ["install"]}
lint = "ruff check src tests scripts docs/conf.py docs/examples/build.py"
format = "ruff format src tests scripts docs/conf.py docs/examples/build.py"
format-check = "ruff format --check src tests scripts docs/conf.py docs/examples/build.py"
type-check = "ty check src"
check = {depends-on = ["test", "lint", "format-check", "type-check"]}
build = "python -m build --no-isolation"
prek = "prek run --all-files"
install-hooks = "prek install"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.docs.dependencies]
sphinx = ">=8"
myst-parser = ">=4"
conda-sphinx-theme = ">=0.3"
sphinx-design = ">=0.6"

[feature.docs.tasks]
docs = "sphinx-build -W --keep-going -n -b dirhtml docs docs/_build/dirhtml"

[feature.build.dependencies]
twine = ">=6.2"
rattler-build = ">=0.48"
actionlint = ">=1.7"

[feature.build.tasks]
check-dist = "python -m twine check --strict dist/conda_skills-*.whl dist/conda_skills-*.tar.gz"
test-wheel = "python scripts/test_wheel.py"
build-conda = "rattler-build build --recipe recipe/recipe.yaml --output-dir conda-dist -c conda-forge"
check-release = "python scripts/check_release.py"
check-workflows = "actionlint"
build-example = "rattler-build build --recipe docs/examples/recipe/recipe.yaml --output-dir conda-dist -c conda-forge"
test-example = { cmd = "python scripts/test_tutorial.py", depends-on = ["install", "build-example"] }

[environments]
default = { solve-group = "default" }
py311 = { features = ["py311"], solve-group = "py311" }
py314 = { features = ["py314"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
