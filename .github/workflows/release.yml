name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source-sha256: ${{ steps.artifacts.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate annotated release tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
      - run: conda install -n base --yes --override-channels -c conda-forge 'conda>=26.9' 'conda-workspaces>=0.12'
      - run: conda workspace install --locked -e build
      - run: conda workspace install --locked -e docs
      - run: conda workspace install --locked -e py311
      - run: conda workspace install --locked -e py314
      - name: Validate release version and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          conda task run -e build check-release "$RELEASE_TAG"
      - run: conda task run -e py311 check
      - run: conda task run -e py314 check
      - run: conda task run -e docs docs
      - run: conda task run -e build build
      - run: conda task run -e build check-dist
      - run: conda task run -e build test-wheel
      - name: Validate exact distributions and record source digest
        id: artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          files=(dist/*)
          wheel="dist/conda_skills-${RELEASE_TAG}-py3-none-any.whl"
          sdist="dist/conda_skills-${RELEASE_TAG}.tar.gz"
          test "${#files[@]}" -eq 2
          test -f "$wheel" && test ! -L "$wheel"
          test -f "$sdist" && test ! -L "$sdist"
          gzip -t "$sdist"
          digest="$(sha256sum "$sdist")"
          printf 'source_sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest distributions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  create-draft-release:
    name: Create draft GitHub release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_sha"
          gh api "repos/$GH_REPO/git/tags/$tag_sha" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --draft --verify-tag --title "$RELEASE_TAG" \
            --generate-notes --repo "$GH_REPO"
          cleanup_draft() {
            gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft ERR
          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO"
          trap - ERR

  publish-pypi:
    name: Publish to PyPI
    needs: create-draft-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/conda-skills
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Verify the release tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_sha"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  publish-conda:
    name: Publish and verify conda package
    needs: [build, publish-pypi]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-conda.yml
    secrets:
      ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
    with:
      version: ${{ github.ref_name }}
      source-sha256: ${{ needs.build.outputs.source-sha256 }}

  publish-github-release:
    name: Publish GitHub release
    needs: [publish-pypi, publish-conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_sha"
          gh api "repos/$GH_REPO/git/tags/$tag_sha" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
