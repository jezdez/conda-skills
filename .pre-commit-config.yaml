repos:
  - repo: builtin
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^conda\.lock$
  - repo: local
    hooks:
      - id: check
        name: Plugin checks
        entry: conda task run -e default check
        language: system
        pass_filenames: false
        always_run: true
