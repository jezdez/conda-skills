[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "conda-skills"
dynamic = ["version"]
description = "Link conda-packaged agent skills into client directories"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Conda is provisioned through conda channels, not PyPI; see conda.toml and recipe/.
dependencies = ["ruamel.yaml>=0.11.14,<0.20", "rich>=13"]

[project.entry-points.conda]
conda-skills = "conda_skill.plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/conda_skill/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/conda_skill"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/scripts", "/recipe",
  "/pyproject.toml", "/conda.toml", "/conda.lock", "/LICENSE", "/README.md",
  "/AGENTS.md", "/CONTRIBUTING.md", "/RELEASING.md", "/CHANGELOG.md",
]
exclude = ["/docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["conda_skill"]
branch = true
patch = ["subprocess"]
omit = ["*/conda_skill/_version.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 95

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/conda_skill/_version.py"]

[tool.ty.src]
exclude = ["src/conda_skill/_version.py"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
