[workspace]
name = "conda-skills"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
conda = ">=26.9"
"ruamel.yaml" = ">=0.11.14,<0.20"
rich = ">=13"

[tasks]
install = { cmd = ["python", "-m", "conda", "pypi", "install", "--yes", "--prefix", "{{ conda.prefix }}", "--editable", "."] }
test = {cmd = "pytest", depends-on = ["install"]}
lint = "ruff check src tests scripts docs/conf.py docs/examples/build.py"
format = "ruff format src tests scripts docs/conf.py docs/examples/build.py"
format-check = "ruff format --check src tests scripts docs/conf.py docs/examples/build.py"
type-check = "ty check src"
check = {depends-on = ["test", "lint", "format-check", "type-check"]}
build = { cmd = "python -m build --no-isolation", default-environment = "build" }
prek = "prek run --all-files"
install-hooks = "prek install"
docs = { cmd = "sphinx-build -W --keep-going -n -b dirhtml docs docs/_build/dirhtml", default-environment = "docs" }
check-dist = { cmd = "python -m twine check --strict dist/conda_skills-*.whl dist/conda_skills-*.tar.gz", default-environment = "build" }
test-wheel = { cmd = "python scripts/test_wheel.py", default-environment = "build" }
build-conda = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir conda-dist -c conda-forge", default-environment = "build" }
check-release = { cmd = ["python", "scripts/check_release.py", "{{ version }}"], args = [{ arg = "version" }], default-environment = "build" }
check-workflows = { cmd = "actionlint", default-environment = "build" }
build-example = { cmd = "rattler-build build --recipe docs/examples/recipe/recipe.yaml --output-dir conda-dist -c conda-forge", default-environment = "build" }
test-example = { cmd = "python scripts/test_tutorial.py", depends-on = ["install", "build-example"], default-environment = "build" }

[feature.dev.dependencies]
ruff = ">=0.14"
ty = ">=0.0.1"
prek = ">=0.5.9"

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=7"
coverage = ">=7.10.6"
conda-pypi = ">=0.13"
hatchling = ">=1.27"
hatch-vcs = ">=0.4"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.docs.dependencies]
sphinx = ">=8"
myst-parser = ">=4"
conda-sphinx-theme = ">=0.3"
sphinx-design = ">=0.6"

[feature.build.dependencies]
conda-pypi = ">=0.13"
hatchling = ">=1.27"
hatch-vcs = ">=0.4"
pip = "*"
python-build = ">=1"
twine = ">=6.2"
rattler-build = ">=0.80"
actionlint = ">=1.7"

[environments]
default = ["dev", "test"]
py311 = ["dev", "test", "py311"]
py314 = ["dev", "test", "py314"]
docs = ["docs"]
build = ["build"]
