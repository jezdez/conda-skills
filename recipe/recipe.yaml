schema_version: 1

context:
  version: "0.2.0"
  source_sha256: ${{ env.get("CONDA_SKILLS_SOURCE_SHA256", default="") }}

package:
  name: conda-skills
  version: ${{ version }}

source:
  - if: source_sha256 != ""
    then:
      url: https://pypi.org/packages/source/c/conda-skills/conda_skills-${{ version }}.tar.gz
      sha256: ${{ source_sha256 }}
    else:
      path: ..

build:
  number: 0
  noarch: python
  script:
    - if: source_sha256 == ""
      then:
        - if: win
          then: set "SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}"
          else: export SETUPTOOLS_SCM_PRETEND_VERSION="${{ version }}"
    - python -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python 3.11.*
    - pip
    - hatchling >=1.27
    - hatch-vcs >=0.4
  run:
    - python >=3.11
    - conda >=26.9
    - rich >=13
    - ruamel.yaml >=0.11.14,<0.20

tests:
  - python:
      imports:
        - conda_skill.plugin
        - conda_skill.cli.main
      pip_check: true
  - script:
      - python scripts/smoke_plugin.py
    files:
      source:
        - scripts/smoke_plugin.py

about:
  summary: Link conda-packaged agent skills into client directories
  license: Apache-2.0
  license_file: LICENSE
